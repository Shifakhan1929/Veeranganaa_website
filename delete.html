<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete Account - Veerangana</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .form-container {
      display: none;
      margin-top: 20px;
      background: #f9f9f9;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      margin-top: 15px;
      padding: 10px 15px;
      background: #b03060;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #8b244b;
    }
    .success-msg {
      display: none;
      margin-top: 15px;
      color: green;
      font-weight: bold;
    }
    .error-msg {
      display: none;
      margin-top: 15px;
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>Delete Your Veerangana Account</h1>
  </header>

  <main>
    <section>
      <p>
        Veerangana only stores your <b>Name</b> and <b>Phone Number</b>.  
        If you want to delete your account and remove this data, please proceed below.
      </p>

      <!-- Delete button -->
      <button onclick="showForm()">Delete My Account</button>

      <!-- Hidden form -->
      <div id="deleteForm" class="form-container">
        <form id="accountDeleteForm" action="https://api.web3forms.com/submit" method="POST">

          <!-- Web3Forms Access Key -->
          <input type="hidden" name="access_key" value="7cc6af1c-abe8-42eb-a94c-c411c5de667a">

          <!-- Subject (optional, helps in email inbox) -->
          <input type="hidden" name="subject" value="Veerangana Account Deletion Request">
          <input type="hidden" name="from_name" value="Veerangana Website">

          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>

          <label for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" required>

          <button type="submit">Submit Request</button>
        </form>

        <div class="success-msg" id="successMsg">✅ Your delete request has been submitted. We will process it within 7 working days.</div>
        <div class="error-msg" id="errorMsg">❌ Something went wrong. Please try again later.</div>
      </div>
    </section>
  </main>

  <script>
    function showForm() {
      document.getElementById("deleteForm").style.display = "block";
    }

    // Web3Forms submission handling with fetch API
    document.getElementById("accountDeleteForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          document.getElementById("successMsg").style.display = "block";
          document.getElementById("errorMsg").style.display = "none";
          form.reset();
        } else {
          document.getElementById("successMsg").style.display = "none";
          document.getElementById("errorMsg").style.display = "block";
        }
      } catch (error) {
        document.getElementById("successMsg").style.display = "none";
        document.getElementById("errorMsg").style.display = "block";
      }
    });
  </script>
</body>
</html>
